<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predicciones R32 · Quiniela Vinet 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#D4A017;--bg:#060610;--s1:#0C0C1A;--s2:#111120;--s3:#181828;
  --brd:rgba(212,160,23,.15);--txt:#E4DCC8;--muted:#7070A0;--dim:#404060;
  --green:#22C55E;--red:#EF4444;--r:6px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:'Barlow',sans-serif;min-height:100vh;}

.hero{background:linear-gradient(160deg,#0a0a1e 0%,#0d0d22 60%,rgba(212,160,23,.08) 100%);
  border-bottom:1px solid var(--brd);padding:22px 16px 18px;text-align:center;}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(24px,6vw,40px);
  letter-spacing:3px;color:var(--gold);line-height:1;}
.hero .sub{font-family:'Barlow Condensed',sans-serif;font-size:11px;
  letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-top:4px;}

.sync-bar{background:var(--s1);border-bottom:1px solid var(--brd);
  padding:6px 16px;text-align:center;font-family:'Barlow Condensed',sans-serif;
  font-size:10px;letter-spacing:1.5px;color:var(--muted);}
.sync-bar span{color:var(--green);}

.toolbar{padding:12px 14px;background:var(--s1);border-bottom:1px solid var(--brd);
  position:sticky;top:0;z-index:10;}
.search-inp{width:100%;background:var(--s2);border:1px solid var(--brd);
  border-radius:var(--r);padding:7px 12px;color:var(--txt);
  font-family:'Barlow Condensed',sans-serif;font-size:13px;outline:none;}
.search-inp:focus{border-color:var(--gold);}
.search-inp::placeholder{color:var(--dim);}

.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
  padding:10px 14px;border-bottom:1px solid var(--brd);}
.leg-item{display:flex;align-items:center;gap:5px;
  font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--muted);}
.leg-dot{width:8px;height:8px;border-radius:2px;}

#container{padding:12px 14px 24px;}

.date-header{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:3px;
  color:var(--gold);padding:14px 4px 6px;border-bottom:1px solid var(--brd);
  margin-bottom:10px;margin-top:16px;}
.date-header:first-child{margin-top:0;}

.match-block{margin-bottom:14px;border-radius:var(--r);overflow:hidden;border:1px solid var(--brd);}
.match-header{background:linear-gradient(135deg,var(--s2),rgba(212,160,23,.05));
  padding:10px 14px;display:flex;align-items:center;justify-content:space-between;
  gap:8px;border-bottom:1px solid var(--brd);}
.match-title{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1.5px;color:#fff;}
.match-meta{font-family:'Barlow Condensed',sans-serif;font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:2px;}
.match-result{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;white-space:nowrap;}
.match-result.done{color:var(--gold);}
.match-result.pending{color:var(--dim);font-size:12px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;}

.preds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
.pred-cell{padding:8px 10px;border-right:1px solid var(--brd);border-bottom:1px solid var(--brd);
  display:flex;flex-direction:column;gap:2px;}
.pred-name{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--muted);
  letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pred-score{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;}
.pred-score.exact{color:var(--green);}
.pred-score.correct{color:var(--gold);}
.pred-score.wrong{color:var(--red);}
.pred-score.pending{color:var(--txt);}
.pred-chip{font-size:8px;letter-spacing:1px;font-family:'Barlow Condensed',sans-serif;font-weight:700;}
.pred-chip.exact{color:var(--green);}
.pred-chip.correct{color:var(--gold);}
.pred-chip.wrong{color:var(--red);}

.loading{text-align:center;padding:60px 20px;font-family:'Barlow Condensed',sans-serif;
  font-size:14px;letter-spacing:2px;color:var(--muted);}
.no-result{text-align:center;padding:40px;color:var(--dim);
  font-family:'Barlow Condensed',sans-serif;letter-spacing:2px;font-size:12px;}

.stats-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  padding:10px 14px;border-bottom:1px solid var(--brd);}
.stat-chip{background:var(--s2);border:1px solid var(--brd);border-radius:20px;
  padding:4px 12px;font-family:'Barlow Condensed',sans-serif;font-size:10px;
  letter-spacing:1px;color:var(--muted);}
.stat-chip span{color:var(--gold);font-weight:700;}
</style>
</head>
<body>

<div class="hero">
  <h1>⚽ Predicciones · Dieciseisavos</h1>
  <div class="sub">Ronda de 32 · Quiniela Vinet 2026</div>
</div>

<div class="sync-bar" id="sync-bar">Cargando datos…</div>

<div class="stats-bar" id="stats-bar"></div>

<div class="toolbar">
  <input class="search-inp" type="text" placeholder="Buscar equipo o participante…" oninput="doSearch(this.value)"/>
</div>

<div class="legend">
  <div class="leg-item"><div class="leg-dot" style="background:var(--green)"></div>Exacto +3</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--gold)"></div>Correcto +1</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--red)"></div>Incorrecto +0</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--dim)"></div>Pendiente</div>
</div>

<div id="container"><div class="loading">⏳ Cargando predicciones…</div></div>

<script>
const SB_URL = 'https://serbnnosjtzmbxmdjtbu.supabase.co';
const SB_KEY = 'sb_publishable_msFNL9C2opQTead4JvFASw_Z6eZhb73';
const HDRS   = {'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`};

// 16 partidos R32 — match_id 73-88
const MATCHES = [
  {id:73, home:'Sudáfrica',       away:'Canadá',          date:'28 Jun', timeCR:'13:00 CR', venue:'Los Ángeles',     flag_h:'🇿🇦', flag_a:'🇨🇦'},
  {id:75, home:'Brasil',          away:'Japón',            date:'29 Jun', timeCR:'11:00 CR', venue:'Houston',         flag_h:'🇧🇷', flag_a:'🇯🇵'},
  {id:74, home:'Alemania',        away:'Paraguay',         date:'29 Jun', timeCR:'14:30 CR', venue:'Boston',          flag_h:'🇩🇪', flag_a:'🇵🇾'},
  {id:76, home:'Países Bajos',    away:'Marruecos',        date:'29 Jun', timeCR:'19:00 CR', venue:'Monterrey',       flag_h:'🇳🇱', flag_a:'🇲🇦'},
  {id:81, home:'Costa de Marfil', away:'Noruega',          date:'30 Jun', timeCR:'11:00 CR', venue:'Dallas',          flag_h:'🇨🇮', flag_a:'🇳🇴'},
  {id:82, home:'Francia',         away:'Suecia',           date:'30 Jun', timeCR:'15:00 CR', venue:'Nueva York',      flag_h:'🇫🇷', flag_a:'🇸🇪'},
  {id:83, home:'México',          away:'Ecuador',          date:'30 Jun', timeCR:'19:00 CR', venue:'Ciudad de México',flag_h:'🇲🇽', flag_a:'🇪🇨'},
  {id:84, home:'Inglaterra',      away:'RD Congo',         date:'1 Jul',  timeCR:'10:00 CR', venue:'Atlanta',         flag_h:'🏴󠁧󠁢󠁥󠁮󠁧󠁿', flag_a:'🇨🇩'},
  {id:80, home:'Bélgica',         away:'Senegal',          date:'1 Jul',  timeCR:'14:00 CR', venue:'Seattle',         flag_h:'🇧🇪', flag_a:'🇸🇳'},
  {id:79, home:'EE.UU.',          away:'Bosnia y Herz.',   date:'1 Jul',  timeCR:'18:00 CR', venue:'San Francisco',   flag_h:'🇺🇸', flag_a:'🇧🇦'},
  {id:78, home:'España',          away:'Austria',          date:'2 Jul',  timeCR:'13:00 CR', venue:'Los Ángeles',     flag_h:'🇪🇸', flag_a:'🇦🇹'},
  {id:77, home:'Portugal',        away:'Croacia',          date:'2 Jul',  timeCR:'17:00 CR', venue:'Toronto',         flag_h:'🇵🇹', flag_a:'🇭🇷'},
  {id:87, home:'Suiza',           away:'Argelia',          date:'2 Jul',  timeCR:'21:00 CR', venue:'Vancouver',       flag_h:'🇨🇭', flag_a:'🇩🇿'},
  {id:86, home:'Australia',       away:'Egipto',           date:'3 Jul',  timeCR:'12:00 CR', venue:'Dallas',          flag_h:'🇦🇺', flag_a:'🇪🇬'},
  {id:85, home:'Argentina',       away:'Cabo Verde',       date:'3 Jul',  timeCR:'16:00 CR', venue:'Miami',           flag_h:'🇦🇷', flag_a:'🇨🇻'},
  {id:88, home:'Colombia',        away:'Ghana',            date:'3 Jul',  timeCR:'19:30 CR', venue:'Kansas City',     flag_h:'🇨🇴', flag_a:'🇬🇭'},
];

let scores={}, preds={}, participants={};
let searchQ='';

function getRes(h,a){return h>a?'H':h<a?'A':'D';}

function getPtsClass(ph,pa,score){
  if(!score) return 'pending';
  if(ph===score.h&&pa===score.a) return 'exact';
  if(getRes(ph,pa)===getRes(score.h,score.a)) return 'correct';
  return 'wrong';
}

function getPtsLabel(cls){
  if(cls==='exact') return '✓✓ +3';
  if(cls==='correct') return '✓ +1';
  if(cls==='wrong') return '+0';
  return '';
}

async function fetchAll(){
  // Scores R32
  try{
    const r=await fetch(`${SB_URL}/rest/v1/scores?select=match_id,home_score,away_score&match_id=gte.73&match_id=lte.88&limit=20`,{headers:HDRS});
    if(r.ok){
      const rows=await r.json();
      scores={};
      rows.forEach(r=>{if(r.home_score!=null&&r.away_score!=null) scores[r.match_id]={h:r.home_score,a:r.away_score};});
    }
  }catch(e){}

  // Participants
  try{
    const r=await fetch(`${SB_URL}/rest/v1/participants?select=id,name&limit=500`,{headers:HDRS});
    if(r.ok){
      const rows=await r.json();
      participants={};
      rows.forEach(p=>{participants[p.id]=p.name;});
    }
  }catch(e){}

  // Predictions R32 only (match_id 73-88)
  try{
    preds={};
    const r=await fetch(`${SB_URL}/rest/v1/predictions?select=participant_id,match_id,home_score,away_score&match_id=gte.73&match_id=lte.88&limit=1000`,{headers:HDRS});
    if(r.ok){
      const rows=await r.json();
      rows.forEach(row=>{
        const name=participants[row.participant_id]||row.participant_id;
        if(!preds[row.match_id]) preds[row.match_id]=[];
        preds[row.match_id].push({name,h:row.home_score,a:row.away_score});
      });
      Object.keys(preds).forEach(mid=>{
        preds[mid].sort((a,b)=>a.name.localeCompare(b.name));
      });
    }
  }catch(e){}

  // Stats
  const total = Object.values(preds).reduce((s,a)=>s+a.length,0);
  const participantes = new Set(Object.values(preds).flatMap(a=>a.map(p=>p.name))).size;
  document.getElementById('stats-bar').innerHTML=`
    <div class="stat-chip">Participantes con picks: <span>${participantes}</span></div>
    <div class="stat-chip">Total predicciones: <span>${total}</span></div>
    <div class="stat-chip">Partidos con picks: <span>${Object.keys(preds).length}/16</span></div>
  `;

  const now=new Date().toLocaleTimeString('es-CR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('sync-bar').innerHTML=`⚡ EN VIVO · Última actualización: <span>${now}</span> · Se actualiza cada 5 minutos`;
  render();
}

function doSearch(v){searchQ=v.toLowerCase().trim();render();}

function render(){
  let matches=MATCHES;
  if(searchQ) matches=matches.filter(m=>
    m.home.toLowerCase().includes(searchQ)||
    m.away.toLowerCase().includes(searchQ)||
    (preds[m.id]||[]).some(p=>p.name.toLowerCase().includes(searchQ))
  );

  if(!matches.length){
    document.getElementById('container').innerHTML='<div class="no-result">Sin partidos que coincidan</div>';
    return;
  }

  // Agrupar por fecha
  const byDate={};
  matches.forEach(m=>{
    if(!byDate[m.date]) byDate[m.date]=[];
    byDate[m.date].push(m);
  });

  const dateOrder=['28 Jun','29 Jun','30 Jun','1 Jul','2 Jul','3 Jul'];

  let html='';
  dateOrder.forEach(date=>{
    if(!byDate[date]) return;
    html+=`<div class="date-header">📅 ${date}</div>`;
    byDate[date].forEach(m=>{
      const score=scores[m.id];
      const scoreStr=score?`${score.h} – ${score.a} 🔒`:'Pendiente';
      const scoreCls=score?'done':'pending';
      const matchPreds=preds[m.id]||[];
      const cells=matchPreds.map(p=>{
        const cls=getPtsClass(p.h,p.a,score);
        const lbl=getPtsLabel(cls);
        return `<div class="pred-cell">
          <div class="pred-name" title="${p.name}">${p.name}</div>
          <div class="pred-score ${cls}">${p.h} - ${p.a}</div>
          ${lbl?`<div class="pred-chip ${cls}">${lbl}</div>`:''}
        </div>`;
      }).join('');

      html+=`<div class="match-block">
        <div class="match-header">
          <div>
            <div class="match-title">${m.flag_h} ${m.home} vs ${m.away} ${m.flag_a}</div>
            <div class="match-meta">${m.timeCR} · ${m.venue} · 16avos de Final</div>
          </div>
          <div class="match-result ${scoreCls}">${scoreStr}</div>
        </div>
        <div class="preds-grid">${cells||'<div class="pred-cell"><div class="pred-name" style="color:var(--dim)">Sin predicciones aún</div></div>'}</div>
      </div>`;
    });
  });

  document.getElementById('container').innerHTML=html;
}

fetchAll();
setInterval(fetchAll, 5*60*1000);
</script>
</body>
</html>
